<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 60 30">
    <defs>
    <filter id="wave" x="-100%" y="-200%" width="300%" height="500%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2"
              stitchTiles="stitch" x="0" y="0" width="30" height="30" result="tile"/>
        <feTile in="tile" result="tiled"/>
        <feOffset in="tiled" dx="0" dy="0" result="moving">
        <animate attributeName="dx" values="0;30" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="dy" values="0;-30" dur="2.5s" repeatCount="indefinite"/>
        </feOffset>
        <feDisplacementMap in="SourceGraphic" in2="moving" scale="11"
                   xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    </defs>
  <g filter="url(#wave)">
    <rect width="60" height="30" fill="#012169"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2"/>
    <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
    <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
  </g>

</svg>