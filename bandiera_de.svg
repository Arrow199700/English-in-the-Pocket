<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" height="60" viewBox="0 0 60 30" width="120">
    <defs>
    <filter height="500%" id="wave" width="300%" x="-100%" y="-200%">
        <feTurbulence baseFrequency="0.045" height="30" numOctaves="2" result="tile" stitchTiles="stitch" type="fractalNoise" width="30" x="0" y="0"/>
        <feTile in="tile" result="tiled"/>
        <feOffset dx="0" dy="0" in="tiled" result="moving">
        <animate attributeName="dx" dur="2.5s" repeatCount="indefinite" values="0;30"/>
        <animate attributeName="dy" dur="2.5s" repeatCount="indefinite" values="0;-30"/>
        </feOffset>
        <feDisplacementMap in="SourceGraphic" in2="moving" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    </defs>
  <g filter="url(#wave)">
    <rect fill="#000000" height="10" width="60"/>
    <rect fill="#DD0000" height="10" width="60" y="10"/>
    <rect fill="#FFCE00" height="10" width="60" y="20"/>
  </g>

</svg>